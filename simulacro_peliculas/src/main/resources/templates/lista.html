<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cartelera</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #999; padding: 6px 12px; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h1>Cartelera</h1>

    <table>
        <thead>
            <tr><th>ID</th><th>Título</th><th>Director</th><th>Acción</th></tr>
        </thead>
        <tbody>
            <!-- Una fila por cada película de la lista -->
            <tr th:each="p : ${peliculas}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.titulo}"></td>
                <td th:text="${p.director}"></td>
                <td><a th:href="@{/peliculas/borrar/{id}(id=${p.id})}">Borrar</a></td>
            </tr>
        </tbody>
    </table>

    <h2>Añadir</h2>
    <!-- Los atributos name coinciden con los campos de la clase Pelicula -->
    <form th:action="@{/peliculas/guardar}" method="post">
        <input type="text" name="titulo" placeholder="Título" required>
        <input type="text" name="director" placeholder="Director" required>
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
